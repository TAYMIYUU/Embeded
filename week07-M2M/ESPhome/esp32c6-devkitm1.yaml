esphome:
  name: esp32c6-devkitm1
  friendly_name: ESP32-C6 DevKitM-1

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

# Enables logging
logger:

# Enables Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot in case wifi connection fails
  ap:
    ssid: "ESP32C6-DevKitM1 Fallback"
    password: !secret ap_password

captive_portal:
